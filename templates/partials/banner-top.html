<!-- Shared top for emails that open with an image banner: page and card only.
     The banner already carries the logo and the brand name, so there's no separate header row. -->
<body dir="rtl" style="margin:0;padding:0;background:#eef0f7;font-family:Tahoma,Arial,sans-serif;color:#1b1d3a;direction:rtl;text-align:right;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#eef0f7" style="border-collapse:collapse;background:#eef0f7;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:600px;border-collapse:separate;background:#ffffff;border-radius:20px;overflow:hidden;">
